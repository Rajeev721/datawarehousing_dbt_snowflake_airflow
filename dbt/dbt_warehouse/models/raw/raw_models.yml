version: 2
models:
    - name: customers
      description: This Table will contain the customer data
      config:
        materialized: incremental
        incremental_strategy: append
        unique_key: CUSTOMER_ID
      columns:
       - name: CUSTOMER_ID
         data_tests:
          - unique
          - not_null
          - primary_key_validation
       - name: BIRTH_YEAR
         data_tests:
          - not_null
       - name: BIRTH_MONTH
         data_tests:
          - not_null
       - name: BIRTH_DAY
         data_tests:
          - not_null
    
    - name: CUSTOMER_ADDRESS
      description: This table will contain the addresses of the customers over time
      columns:
       - name: ADDRESS_ID
         data_tests:
          - unique
          - not_null
          - primary_key_validation